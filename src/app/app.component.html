<div class="app">
	<app-users
		id="users"
		[users]="users()"
		[selectedUserId]="selectedUserId()"
		[isFetching]="isUserFetching()"
		(addUser)="onOpenAddUser()"
		(selectUser)="onSelectUser($event)"
	/>
	<app-categories
		id="categories"
		[categories]="categories()"
		[selectedCategoryId]="selectedCategoryId()"
		[isFetching]="isCategoryFetching()"
	/>
	@if(isAddingUser) {
		<app-add-user
			id="add-user"
			(addUser)="onAddUser($event)"
			(cancel)="onCloseAddUser()"
		/>
	}
</div>
